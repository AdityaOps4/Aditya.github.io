<style>
:root{--bg:#0b0f19;--card:rgba(255,255,255,.03);--ink:#fff;--text:#cbd5e1;--mute:#94a3b8;--line:rgba(255,255,255,.06);--accent:#38bdf8;--accent-soft:rgba(56,189,248,.12);--slate:#334155;--red:#f87171;--amber:#fbbf24;--green:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top left,#1d4ed840,transparent 30%),radial-gradient(circle at bottom right,#06b6d430,transparent 30%);z-index:-1}
.wrap{max-width:1360px;margin:0 auto;padding:0 5%}
header{background:rgba(10,15,25,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 14px}
.brand{display:flex;align-items:center;gap:18px}
.brand .ak{color:var(--accent);font-size:24px;font-weight:700}
.brand small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{margin-top:3px;font-size:19px;font-weight:650;letter-spacing:-.01em}
.back{color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:9px 16px;border-radius:12px;font-size:14px;transition:.3s ease}
.back:hover{background:var(--accent);color:var(--bg)}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:16px}
nav button{border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:500;padding:8px 18px;cursor:pointer;border-radius:999px;white-space:nowrap;transition:.3s ease}
nav button:hover{border-color:var(--accent);color:var(--accent)}
nav button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.fbar{position:sticky;top:0;z-index:20;background:rgba(11,15,25,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0}
.flabel{font-size:12px;color:var(--mute);margin-right:4px;letter-spacing:.08em;text-transform:uppercase}
.dd{position:relative}
.ddb{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:.25s ease}
.ddb:hover{border-color:var(--accent);color:#fff}
.ddb.on{border-color:var(--accent);background:var(--accent-soft);color:#fff}
.ddb b{background:var(--accent);color:var(--bg);border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.pop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-height:300px;overflow:auto;background:#0f1626;border:1px solid rgba(56,189,248,.25);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 30px rgba(56,189,248,.08);padding:6px;z-index:30}
.opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--text)}
.opt:hover{background:var(--accent-soft)}
.opt i{width:16px;height:16px;border:1.5px solid var(--slate);border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--bg);flex:none;font-weight:700}
.opt.on i{background:var(--accent);border-color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.pill{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(56,189,248,.3);border-radius:99px;padding:5px 10px 5px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.pill span{opacity:.7}
.clear{margin-left:auto;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.clear:hover{color:var(--red)}
main{padding:28px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:18px;margin-bottom:22px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(10px);position:relative;overflow:hidden;transition:.4s ease}
.kpi{padding:24px 20px;text-align:center}
.kpi::before{content:'';position:absolute;width:160%;height:160%;background:linear-gradient(130deg,transparent,rgba(56,189,248,.07),transparent);top:-120%;left:-120%;transition:.8s ease}
.kpi:hover::before{top:0;left:0}
.kpi:hover,.card:hover{border-color:var(--accent);box-shadow:0 0 35px rgba(56,189,248,.16),0 0 70px rgba(56,189,248,.06)}
.kpi:hover{transform:translateY(-6px)}
.kpi .v{white-space:nowrap;font-size:clamp(24px,2.5vw,34px);font-weight:700;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative}
.kpi.bad .v{color:var(--red)}.kpi.warn .v{color:var(--amber)}.kpi.good .v{color:var(--green)}
.kpi .l{font-size:13px;color:var(--text);margin-top:8px;font-weight:500;position:relative}
.kpi .s{font-size:12px;color:var(--mute);margin-top:4px;position:relative}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:22px}
.card{padding:26px 28px 22px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.ch h3{font-size:18px;font-weight:600;color:var(--accent)}
.ch p{margin-top:3px;font-size:12.5px;color:var(--mute)}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.25s}
.seg button:hover{color:#fff}
.seg button.on{background:var(--accent);color:var(--bg);font-weight:700}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.chart{position:relative;height:310px}.chart.sm{height:260px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1;max-width:260px;font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:#fff;outline:none}
.tools input:focus{border-color:var(--accent)}
.tools button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--accent);border-radius:12px;background:transparent;cursor:pointer;color:var(--accent);transition:.3s}
.tools button:hover{background:var(--accent);color:var(--bg)}
.tw{overflow:auto;max-height:330px}
table{border-collapse:collapse;width:100%;font-size:13px;color:var(--text)}
th{position:sticky;top:0;background:#0e1422;text-align:left;padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--accent);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft);color:#fff}tr.sel td{background:rgba(56,189,248,.2);color:#fff;font-weight:600}
.tag{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600}
.tag.Healthy{background:rgba(52,211,153,.14);color:#34d399}.tag.Reorder{background:rgba(248,113,113,.14);color:#f87171}
footer{text-align:center;font-size:12.5px;color:var(--mute);padding:24px 0 36px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
@media(max-width:960px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.card{padding:20px}}
</style>
</head>
<body>

const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MKEYS=MN.map((m,i)=>'2025-'+String(i+1).padStart(2,'0'));
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const avg=(a,f)=>a.length?sum(a,f)/a.length:0;
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const pct=n=>(n*100).toFixed(1)+'%';
const inr=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':'₹'+fmt(n);
const div=(a,b)=>b?a/b:0;
const uniq=a=>[...new Set(a)];
const DIMS={month:'m',dept:'Department',loc:'Location',gender:'Gender',level:'JobLevel',etype:'EmploymentType',source:'Source',stage:'CurrentStage',attStatus:'AttendanceStatus',leaveType:'LeaveType',rating:'PerformanceRating',reqStatus:'RequisitionStatus',trainStatus:'TrainingStatus'};
const KEYS=Object.keys(DIMS);
const F={};KEYS.forEach(k=>F[k]=new Set());
const TAB={};let page='overview',charts=[];

// ---- cross-filter engine: a filter applies to every table that carries that field ----
function T(name,ex){const f=DIMS;return D[name].filter(r=>KEYS.every(k=>k===ex||!F[k].size||!(f[k] in r)||F[k].has(r[f[k]])))}
function toggle(k,v){const s=F[k];s.has(v)?s.delete(v):s.add(v);refresh()}
function refresh(){renderFilters();renderPage()}
const avgHC=(rows)=>{const m=new Map();rows.forEach(r=>m.set(r.m,(m.get(r.m)||0)+1));return m.size?[...m.values()].reduce((a,b)=>a+b,0)/m.size:0};
function M(){
  const emp=T('emp'),hc=T('hc'),ex=T('exits'),c=T('cand'),rq=T('req'),a=T('att'),lv=T('leave'),pf=T('perf'),en=T('eng'),tr=T('train'),py=T('pay');
  const hired=c.filter(r=>r.hired),hd=hired.filter(r=>r.days!=null);
  const present=sum(a.filter(r=>r.AttendanceStatus==='Present'),r=>r.n),absent=sum(a.filter(r=>r.AttendanceStatus==='Absent'),r=>r.n),recs=sum(a,r=>r.n);
  const hcAvg=avgHC(hc);
  return{total:emp.length,active:emp.filter(r=>r.EmploymentStatus==='Active').length,exits:ex.length,hcAvg,attr:div(ex.length,hcAvg),
   apps:c.length,hires:hired.length,conv:div(hired.length,c.length),openReq:rq.filter(r=>r.RequisitionStatus==='Open').length,
   tth:avg(hd,r=>r.days),pipe:c.filter(r=>!['Hired','Rejected','Withdrawn'].includes(r.CurrentStage)).length,offers:sum(c,r=>r.offer),ctc:avg(c,r=>r.ExpectedCTC_INR),
   present,absent,recs,attRate:div(present,present+absent),absRate:div(absent,present+absent),hrs:div(sum(a,r=>r.act),recs),
   leaves:lv.length,leavesOk:lv.filter(r=>r.ApprovalStatus==='Approved').length,
   pos:div(pf.filter(r=>['Meets Expectations','Exceeds Expectations','Outstanding'].includes(r.PerformanceRating)).length,pf.length),goal:avg(pf,r=>r.GoalAchievementPct),
   eng:avg(en,r=>r.EngagementScore),mgr:avg(en,r=>r.ManagerSupportScore),
   trComp:div(tr.filter(r=>r.TrainingStatus==='Completed').length,tr.length),trHrs:sum(tr,r=>r.TrainingHours),
   gross:sum(py,r=>r.Gross||r.GrossPay_INR),net:sum(py,r=>r.NetPay_INR),ded:sum(py,r=>r.Deductions_INR),avgSal:avg(py,r=>r.GrossPay_INR),
   ctcEmp:avg(emp,r=>r.AnnualCTC_INR),paid:uniq(py.map(r=>r.EmployeeID)).length,dedRate:div(sum(py,r=>r.Deductions_INR),sum(py,r=>r.GrossPay_INR))}
}

// ---- chart plumbing ----
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const A=()=>'#38bdf8',S=()=>'#334155';
const DON=()=>['#38bdf8','#6366f1','#22d3ee','#a78bfa','#f472b6','#34d399','#fbbf24'];
function themeChart(){Chart.defaults.color=css('--mute');Chart.defaults.borderColor=css('--line');Chart.defaults.font.family='Inter,system-ui,sans-serif';Chart.defaults.font.size=12}
const nf=v=>Math.abs(v)>=1e7?+(v/1e7).toFixed(1)+'Cr':Math.abs(v)>=1e5?+(v/1e5).toFixed(1)+'L':Math.abs(v)>=1e3?+(v/1e3).toFixed(0)+'k':v;
const tipVal=c=>{const o=c.chart.config.options;let v=o.indexAxis==='y'?c.parsed.x:(c.parsed&&c.parsed.y!==undefined?c.parsed.y:c.parsed);return typeof v==='number'?v.toLocaleString('en-IN',{maximumFractionDigits:2}):v};
const KF={n:fmt,p:pct,i:inr,r:v=>Math.round(v),d:v=>v.toFixed(1)};
const kpi=(l,val,f,cls='',sub='')=>`<div class="kpi ${cls}"><div class="l">${l}</div><div class="v" data-l="${l}" data-v="${val}" data-f="${f}">${KF[f](val)}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
const prevK={};
function animateKpis(){document.querySelectorAll('.kpi .v').forEach(el=>{const to=+el.dataset.v,from=prevK[el.dataset.l]??0,f=KF[el.dataset.f];prevK[el.dataset.l]=to;const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(s)})(t0)})}
function group(rows,kf,vf){const m=new Map();rows.forEach(r=>{const k=kf(r);if(k==null)return;m.set(k,(m.get(k)||0)+(+vf(r)||0))});return m}
const topN=m=>[...m.entries()].sort((a,b)=>b[1]-a[1]);
const mSel={key:'month',val:l=>MKEYS[MN.indexOf(l)]};
const alpha=(c,on)=>on?c+'4d':c;
function mk_chart(id,cfg,sel){
  const el=document.getElementById(id);if(!el)return;
  if(sel){const Sx=F[sel.key],has=Sx.size>0,vals=cfg.data.labels.map(sel.val||(x=>x));
    cfg.data.datasets.forEach(ds=>{
      if(cfg.type==='doughnut')ds.backgroundColor=vals.map((v,i)=>alpha(DON()[i%7],has&&!Sx.has(v)));
      else if(cfg.type==='line'){ds.pointRadius=vals.map(v=>has&&Sx.has(v)?7:3);ds.pointBackgroundColor=vals.map(v=>has&&Sx.has(v)?css('--red'):ds.borderColor)}
      else{const b=ds.backgroundColor;ds.backgroundColor=vals.map(v=>alpha(b,has&&!Sx.has(v)))}});
    cfg.options=cfg.options||{};cfg.options.onClick=(e,els)=>{if(els.length)toggle(sel.key,vals[els[0].index])};
    cfg.options.onHover=(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default'};
  }
  const multi=cfg.data.datasets.length>1;
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:400},interaction:{mode:cfg.type==='line'?'index':'nearest',intersect:false},
   plugins:{legend:{display:multi||cfg.type==='doughnut',position:cfg.type==='doughnut'?'right':'top',align:'end',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:7,padding:14}},
    tooltip:{backgroundColor:'#0f1626',borderColor:'rgba(56,189,248,.35)',borderWidth:1,titleColor:'#fff',bodyColor:'#cbd5e1',padding:12,cornerRadius:12,callbacks:{label:c=>{if(cfg.type==='scatter')return` ${c.raw.id}: engagement ${c.raw.x.toFixed(1)}, manager support ${c.raw.y.toFixed(1)}`;const v=tipVal(c);if(cfg.type==='doughnut'){const t=c.dataset.data.reduce((a,b)=>a+b,0);return` ${c.label}: ${v} (${(c.parsed/t*100).toFixed(1)}%)`}return` ${c.dataset.label||''}: ${v}`}}}}},cfg.options||{});
  if(cfg.type==='scatter'){const val=(t)=>({title:{display:true,text:t,color:css('--mute')},min:0,max:10,border:{display:false},grid:{color:css('--line')}});cfg.options.scales={x:val('Engagement score'),y:val('Manager support score')}}
  else if(cfg.type!=='doughnut'){
    const h=cfg.options.indexAxis==='y',u=cfg.options.scales||{};
    const cat={grid:{display:false},border:{display:false},ticks:{maxRotation:0,autoSkip:false}};
    const val={beginAtZero:true,border:{display:false},grid:{color:css('--line')},ticks:{callback:nf,maxTicksLimit:5}};
    cfg.options.scales=h?{y:Object.assign({},cat,u.y),x:Object.assign({},val,u.x)}:{x:Object.assign({},cat,u.x),y:Object.assign({},val,u.y)};
  }
  charts.push(new Chart(el,cfg));
}
const bar=(id,labels,sets,o,sel)=>mk_chart(id,{type:'bar',data:{labels,datasets:sets.map(s=>({label:s.label,data:s.data,backgroundColor:s.color||A(),borderRadius:6,maxBarThickness:34}))},options:o},sel);
const line=(id,labels,sets,o,sel)=>mk_chart(id,{type:'line',options:o,data:{labels,datasets:sets.map((s,i)=>({label:s.label,data:s.data,borderColor:s.color||[A(),'#a78bfa'][i],backgroundColor:(s.color||A())+'1f',tension:.35,fill:sets.length===1,borderWidth:2.5}))}},sel);
const donut=(id,labels,data,sel)=>mk_chart(id,{type:'doughnut',data:{labels,datasets:[{data,borderWidth:3,borderColor:'#0e1422'}]},options:{cutout:'68%',layout:{padding:6}}},sel);
function card(id,title,span,{sub='',tabs=null,cls=''}={}){
  const cur=TAB[id]||(tabs&&tabs[0][0]);
  return `<div class="card ${span}"><div class="ch"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${tabs?`<div class="seg">${tabs.map(([k,l])=>`<button data-tab="${id}" data-k="${k}" class="${k===cur?'on':''}">${l}</button>`).join('')}</div>`:''}</div><div class="chart ${cls}"><canvas id="${id}"></canvas></div></div>`;
}
const tab=(id,def)=>TAB[id]||def;
const hbar=(id,m,label,color,key,fmtv)=>{const x=topN(m);bar(id,x.map(a=>a[0]),[{label,data:x.map(a=>a[1]),color}],{indexAxis:'y'},key?{key}:undefined)};
const byMonth=(rows,vf)=>{const g=group(rows,r=>r.m,vf);return MKEYS.map(k=>g.get(k)||0)};
const dn=(id,rows,kf,key)=>{const x=topN(group(rows,kf,()=>1));donut(id,x.map(a=>a[0]),x.map(a=>a[1]),key?{key}:undefined)};

   ${kpi('Present days',m.present,'n')}${kpi('Absent days',m.absent,'n','bad')}${kpi('Leave requests',m.leaves,'n','warn',fmt(m.leavesOk)+' approved')}</div>
  <div class="grid">
   ${card('a1','Attendance trend','c8',{tabs:[['rate','Attendance rate %'],['abs','Absent days']],sub:'Click a point to filter by month'})}
   ${card('a2','Attendance status','c4')}
   ${card('a3','By department','c6',{tabs:[['abs','Absent days'],['rec','Records'],['hrs','Hours']],cls:'sm'})}
   ${card('a4','Leave requests by type','c6',{cls:'sm'})}</div>`;
  const a=T('att','month'),pre=group(a.filter(r=>r.AttendanceStatus==='Present'),r=>r.m,r=>r.n),ab=group(a.filter(r=>r.AttendanceStatus==='Absent'),r=>r.m,r=>r.n);
  if(tab('a1','rate')==='rate')line('a1',MN,[{label:'Attendance rate %',data:MKEYS.map(k=>+(div(pre.get(k)||0,(pre.get(k)||0)+(ab.get(k)||0))*100).toFixed(1))}],{scales:{y:{min:90,max:100,beginAtZero:false}}},mSel);
  else bar('a1',MN,[{label:'Absent days',data:MKEYS.map(k=>ab.get(k)||0),color:'#f87171'}],{},mSel);
  const st=topN(group(T('att','attStatus'),r=>r.AttendanceStatus,r=>r.n));donut('a2',st.map(x=>x[0]),st.map(x=>x[1]),{key:'attStatus'});
  const ad=T('att','dept'),t3=tab('a3','abs');
  if(t3==='abs')hbar('a3',group(ad.filter(r=>r.AttendanceStatus==='Absent'),r=>r.Department,r=>r.n),'Absent days','#f87171','dept');
  else if(t3==='rec')hbar('a3',group(ad,r=>r.Department,r=>r.n),'Records',A(),'dept');
  else{const ds=topN(group(ad,r=>r.Department,r=>r.sch)).map(x=>x[0]),s=group(ad,r=>r.Department,r=>r.sch),c=group(ad,r=>r.Department,r=>r.act);
   bar('a3',ds,[{label:'Scheduled hrs',data:ds.map(d=>Math.round(s.get(d))),color:S()},{label:'Actual hrs',data:ds.map(d=>Math.round(c.get(d)))}],{indexAxis:'y'},{key:'dept'})}
  dn('a4',T('leave','leaveType'),r=>r.LeaveType,'leaveType');
 }},
 performance:{title:'Performance',sl:['dept','loc','gender','level'],render(){
  const m=M();
  document.getElementById('page').innerHTML=`
  <div class="kpis">${kpi('Positive performance',m.pos,'p','good')}${kpi('Goal achievement',m.goal,'d','','% average')}${kpi('Avg engagement',m.eng,'d','','out of 10')}

   ${card('p3','Engagement trend','c4',{sub:'By survey month',cls:'sm'})}

  const ts=topN(group(T('train','trainStatus'),r=>r.TrainingStatus,()=>1));donut('p5',ts.map(x=>x[0]),ts.map(x=>x[1]),{key:'trainStatus'});
 }},
 payroll:{title:'Payroll',sl:['month','dept','loc','gender'],render(){

  bar('y3',ds,[{label:'Gross pay',data:ds.map(d=>Math.round(g.get(d))),color:A()},{label:'Net pay',data:ds.map(d=>Math.round(n.get(d))),color:'#34d399'}],{indexAxis:'y'},{key:'dept'});

function avgBy(rows,vf){const m=new Map();rows.forEach(r=>{const o=m.get(r.Department)||[0,0];o[0]+=+vf(r)||0;o[1]++;m.set(r.Department,o)});return new Map([...m].map(([k,v])=>[k,+(v[0]/v[1]).toFixed(1)]))}

// ---- compact dropdown filters ----
const SRC={dept:()=>uniq(D.emp.map(r=>r.Department)),loc:()=>uniq(D.emp.map(r=>r.Location)),gender:()=>uniq(D.emp.map(r=>r.Gender)),level:()=>['Analyst','Consultant','Senior Consultant','Manager','Director'],
 etype:()=>uniq(D.emp.map(r=>r.EmploymentType)),source:()=>uniq(D.cand.map(r=>r.Source)),stage:()=>['Applied','Screening','Interview','Offer','Hired','Rejected','Withdrawn'],
 attStatus:()=>uniq(D.att.map(r=>r.AttendanceStatus)),leaveType:()=>uniq(D.leave.map(r=>r.LeaveType)),rating:()=>uniq(D.perf.map(r=>r.PerformanceRating)),reqStatus:()=>uniq(D.req.map(r=>r.RequisitionStatus)),trainStatus:()=>uniq(D.train.map(r=>r.TrainingStatus))};
const LBL={month:'Month',dept:'Department',loc:'Location',gender:'Gender',level:'Job level',etype:'Employment type',source:'Source',stage:'Stage',attStatus:'Attendance status',leaveType:'Leave type',rating:'Rating',reqStatus:'Requisition',trainStatus:'Training'};
const opts=k=>k==='month'?MKEYS.map((v,i)=>[v,MN[i]+' 2025']):SRC[k]().sort().map(x=>[x,x]);
let openDD=null;
function renderFilters(){
  const el=document.getElementById('filters'),sl=PAGES[page].sl;
  const act=sl.flatMap(k=>[...F[k]].map(v=>[k,v]));
  const label=(k,v)=>k==='month'?MN[MKEYS.indexOf(v)]+' 2025':v;
  el.innerHTML=`<span class="flabel">Filter</span>`+sl.map(k=>`<div class="dd"><button class="ddb ${F[k].size?'on':''}" data-dd="${k}">${LBL[k]}${F[k].size?` <b>${F[k].size}</b>`:''} ▾</button>${openDD===k?`<div class="pop">${opts(k).map(([v,t])=>`<div class="opt ${F[k].has(v)?'on':''}" data-k="${k}" data-v="${v}"><i>${F[k].has(v)?'✓':''}</i>${t}</div>`).join('')}</div>`:''}</div>`).join('')+
   (act.length?`<div class="pills">${act.map(([k,v])=>`<button class="pill" data-k="${k}" data-v="${v}">${label(k,v)} <span>✕</span></button>`).join('')}</div><button class="clear" id="reset">Clear all</button>`:'');
  el.querySelectorAll('.ddb').forEach(b=>b.onclick=e=>{e.stopPropagation();openDD=openDD===b.dataset.dd?null:b.dataset.dd;renderFilters()});
  el.querySelectorAll('.opt').forEach(o=>o.onclick=e=>{e.stopPropagation();const s=F[o.dataset.k],v=o.dataset.v;s.has(v)?s.delete(v):s.add(v);renderFilters();renderPage()});
  el.querySelectorAll('.pill').forEach(p=>p.onclick=()=>toggle(p.dataset.k,p.dataset.v));
  const r=document.getElementById('reset');if(r)r.onclick=()=>{KEYS.forEach(k=>F[k].clear());refresh()};
}
document.addEventListener('click',()=>{if(openDD){openDD=null;renderFilters()}});
function renderPage(){charts.forEach(c=>c.destroy());charts=[];themeChart();PAGES[page].render();animateKpis();
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{TAB[b.dataset.tab]=b.dataset.k;renderPage()})}
function renderNav(){const n=document.getElementById('nav');
  n.innerHTML=Object.entries(PAGES).map(([k,p])=>`<button data-k="${k}" class="${k===page?'on':''}">${p.title}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.k;location.hash=page;openDD=null;renderNav();refresh()})}
if(window.self===window.top)document.getElementById('back').style.display='';
if(PAGES[location.hash.slice(1)])page=location.hash.slice(1);
renderNav();refresh();
</script>
